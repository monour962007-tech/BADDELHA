<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بدّلها — BADDELHA</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#09294C;--tq:#0AC6B3;--bg:#fff;--g:#F5F7FA;--bd:#E5EAF0;--mut:#64748B;--tx:#09294C;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2b;--g:#10243a;--bd:#1f3a57;--mut:#9fb2c8;--tx:#eaf2fa;--card:#112b46}}
:root[data-theme="dark"]{--bg:#0b1a2b;--g:#10243a;--bd:#1f3a57;--mut:#9fb2c8;--tx:#eaf2fa;--card:#112b46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#09294C;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:#09294C;z-index:9;display:flex;align-items:center;gap:14px;padding:8px 16px}
header img{height:44px;border-radius:10px;background:#fff;display:block}
nav{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}nav a{color:#cfe0f1;text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap;font-weight:600;font-size:14px}
nav a.on,nav a:hover{background:rgba(10,198,179,.2);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
h1{font-size:clamp(26px,5vw,44px);line-height:1.3;font-weight:800;margin:0 0 12px}h2{font-size:22px;margin:32px 0 12px}
.btn{background:var(--tq);color:#06302c;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.btn:hover{filter:brightness(.93);transform:translateY(-1px)}
.btn.o{background:transparent;border:1.5px solid var(--bd);color:var(--tx)}.btn.s{padding:6px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(9,41,76,.05)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.hero{display:grid;gap:24px;grid-template-columns:1.2fr 1fr;align-items:center;padding:20px 0}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.mut{color:var(--mut);font-size:14px}.tag{display:inline-block;background:var(--g);border:1px solid var(--bd);border-radius:20px;padding:1px 10px;margin:2px;font-size:13px}.tag.t{background:rgba(10,198,179,.15);border-color:var(--tq)}
.av{width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}
input,select,textarea{font:inherit;border:1.5px solid var(--bd);border-radius:10px;padding:8px 12px;background:var(--card);color:var(--tx);max-width:100%}
.bar{height:8px;background:var(--g);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tq)}
.m{font-weight:800;color:var(--tq)}.stat{text-align:center}.stat b{font-size:28px;display:block}
#modal{position:fixed;inset:0;background:rgba(9,41,76,.55);display:none;place-items:center;z-index:20;padding:16px}#modal.on{display:grid}#modal .card{width:min(440px,100%);max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:10px;z-index:30;display:none}
.chat{display:grid;grid-template-columns:230px 1fr;gap:14px;min-height:420px}@media(max-width:700px){.chat{grid-template-columns:1fr}}
.msgs{height:300px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:6px}.b{padding:6px 12px;border-radius:12px;max-width:75%;background:var(--g)}.b.me{background:var(--tq);color:#06302c;align-self:flex-start}
canvas{width:100%;touch-action:none;background:#fff;border:1.5px solid var(--bd);border-radius:12px}
footer{background:#09294C;color:#cfe0f1;text-align:center;padding:20px;font-size:14px}
.tabs{overflow-x:auto}
</style></head><body>

<h2>المجتمع (أرقام تجريبية)</h2><div class="grid card">${[['+1,200','عضو'],['+640','جلسة تبادل'],['48','تحدي نشط'],['4.8','متوسط التقييم']].map(a=>`<div class="stat"><b class="m">${a[0]}</b>${a[1]}</div>`).join('')}</div>

<div class="card" style="text-align:center;margin-top:30px;background:var(--navy);color:#fff"><h2 style="margin:0 0 8px">جاهز تبدّلها؟</h2><button class="btn" onclick="auth()">إنشاء حساب</button></div>`},
discover(){return `<h1 style="font-size:30px">اكتشف المهارات</h1><div class="row card"><input id="q" placeholder="ابحث بمهارة أو اسم أو جامعة…" list="sg" oninput="list()" style="flex:1;min-width:180px"><datalist id="sg">${[...new Set(U.flatMap(u=>u.t))].map(x=>`<option>${x}</option>`).join('')}</datalist>
<select id="fc" onchange="list()"><option value="">كل التصنيفات</option>${[...new Set(U.map(u=>u.c))].map(c=>`<option>${c}</option>`).join('')}</select>
<select id="fm" onchange="list()"><option value="">أونلاين / حضوري</option><option value="online">أونلاين</option><option value="offline">حضوري</option></select>
<select id="fl" onchange="list()"><option value="">كل المستويات</option><option>مبتدئ</option><option>متوسط</option><option>متقدم</option></select>
<select id="fs" onchange="list()"><option value="m">الأنسب</option><option value="r">الأعلى تقييماً</option><option value="a">الأكثر نشاطاً</option></select></div><p class="mut" id="cnt"></p><div class="grid" id="ul"></div>`},
dashboard(){const t=rank().slice(0,3);return `<h1 style="font-size:30px">أهلاً ${S.auth?'بيك':'بيك (وضع تجريبي)'} 👋</h1><div class="grid"><div class="card"><b>اكتمال الملف: 80%</b><div class="bar"><i style="width:80%"></i></div><p class="mut">أضف شهادة أو مشروع لرفع النسبة.</p></div>
<div class="card"><b>رصيد المهارات</b><div class="m" style="font-size:30px">${S.cr}</div><a href="#credits">السجل</a></div>
<div class="card"><b>أعلّم</b><br>${me.t.map(x=>`<span class="tag t">${x}</span>`).join('')}<br><b>عايز أتعلم</b><br>${me.l.map(x=>`<span class="tag">${x}</span>`).join('')}</div>
<div class="card"><b>جلسات قادمة</b><p class="mut">السبت 6 م — إنجليزي مع سلمى (أونلاين)<br>الاثنين 4 م — مونتاج مع كريم (حضوري)</p></div></div>
<h2>طلبات التبادل</h2><div class="grid">${S.reqs.map((r,i)=>`<div class="card"><b>${r.to}</b><div class="mut">أتعلم ${r.a} ← أعلّم ${r.b}</div><span class="tag t">${r.st}</span> ${r.st=='قيد الانتظار'?`<button class="btn s o" onclick="S.reqs[${i}].st='ملغي';render()">إلغاء</button><button class="btn s" onclick="S.reqs[${i}].st='مقبول';T('تم القبول (محاكاة)');render()">محاكاة القبول</button>`:''}</div>`).join('')}</div>
<h2>مطابقات مقترحة</h2><div class="grid">${t.map(card).join('')}</div>`},
chat(){return `<h1 style="font-size:30px">المحادثات</h1><div class="chat card"><div id="cl"></div><div><b id="ct"></b><div class="msgs" id="ms"></div><div class="row"><input id="ci" placeholder="اكتب رسالة…" style="flex:1" onkeydown="if(event.key=='Enter')send()"><button class="btn" onclick="send()">إرسال</button></div></div></div><p class="mut">ردود تلقائية تجريبية — لا يوجد خادم رسائل بعد.</p>`},
board(){return `<h1 style="font-size:30px">السبورة الذكية</h1><div class="row" style="margin-bottom:8px">${['#09294C','#0AC6B3','#e11d48','#f59e0b'].map(c=>`<button class="btn s" style="background:${c};width:34px;height:34px" aria-label="لون" onclick="pc=c0='${c}';er=0"></button>`).join('')}<button class="btn s o" onclick="er=1">ممحاة</button><button class="btn s o" onclick="bd.clearRect(0,0,800,420)">مسح</button><button class="btn s o" onclick="note()">+ ملاحظة</button></div><canvas id="cv" width="800" height="420"></canvas><div class="row" id="nt" style="margin-top:10px"></div><p class="mut">رسم محلي لمستخدم واحد. التعاون الفوري يحتاج WebSocket أو Supabase Realtime.</p>`},
credits(){return `<h1 style="font-size:30px">رصيد تبادل المهارات</h1><div class="card"><span class="m" style="font-size:36px">${S.cr}</span> نقطة <span class="mut">(نقاط داخلية — ليست أموالاً)</span><div><button class="btn s" onclick="S.cr+=2;S.tx.unshift(['إنهاء جلسة تدريس',2]);render();T('+2 نقطة')">إنهاء جلسة تدريس</button></div></div><h2>السجل</h2>${S.tx.map(t=>`<div class="card row" style="margin:6px 0"><span>${t[0]}</span><span class="sp"></span><b style="color:${t[1]>0?'#0a9a8b':'#d33'}">${t[1]>0?'+':''}${t[1]}</b></div>`).join('')}`},
challenges(){const C=[['تحدي الإنجليزي — 7 أيام',7],['تحدي التصميم الأسبوعي',5],['تحدي صناعة المحتوى — 14 يوم',14]];return `<h1 style="font-size:30px">تحديات بدّلها</h1><div class="grid">${C.map((c,i)=>{const p=S.ch[i];return `<div class="card"><b>${c[0]}</b><div class="bar" style="margin:8px 0"><i style="width:${p==null?0:p/c[1]*100}%"></i></div>${p==null?`<button class="btn s" onclick="S.ch[${i}]=0;render()">انضم</button>`:`<span class="mut">${p}/${c[1]} يوم</span> <button class="btn s" ${p>=c[1]?'disabled':''} onclick="S.ch[${i}]++;if(S.ch[${i}]==${c[1]}){S.cr+=5;S.tx.unshift(['إكمال تحدي',5]);T('🏅 أكملت التحدي! +5 نقاط')}render()">سجّل يوم</button>`}</div>`}).join('')}</div>`}
};
let cur='home',bd,pc='#09294C',er=0;
function list(){const q=$('#q').value.trim(),c=$('#fc').value,m=$('#fm').value,l=$('#fl').value,s=$('#fs').value;
 let a=U.filter(u=>(!q||[u.n,u.u,u.loc,...u.t,...u.l].join(' ').includes(q))&&(!c||u.c==c)&&(!m||u.m==m||u.m=='both')&&(!l||u.lv==l));
 a.sort((x,y)=>s=='r'?y.r-x.r:s=='a'?y.ex-x.ex:match(y).s-match(x).s);$('#cnt').textContent=a.length+' نتيجة';$('#ul').innerHTML=a.length?a.map(card).join(''):'<div class="card">لا توجد نتائج. جرّب تغيير الفلاتر.</div>'}
function cl(){const u=U[S.cc??0];$('#cl').innerHTML=U.slice(0,5).map(x=>`<div class="card row" style="margin:4px 0;cursor:pointer;${x.id==(S.cc??0)?'border-color:var(--tq)':''}" onclick="S.cc=${x.id};cl()"><div class="av" style="width:34px;height:34px">${x.n[0]}</div>${x.n}</div>`).join('');$('#ct').textContent=u.n+' · متصل';const h=S.chat[u.id]||(S.chat[u.id]=[[0,'أهلاً! شفت إنك بتدرّس تصميم، نتبادل؟']]);$('#ms').innerHTML=h.map(m=>`<div class="b ${m[0]?'me':''}">${m[1]}</div>`).join('');$('#ms').scrollTop=1e5}
function send(){const v=$('#ci').value.trim();if(!v)return;const id=S.cc??0;S.chat[id].push([1,v]);$('#ci').value='';cl();$('#ms').insertAdjacentHTML('beforeend','<div class="b" id="ty">يكتب…</div>');
 setTimeout(()=>{S.chat[id].push([0,['تمام، يناسبني السبت.','ممتاز! ابعتلي وقت يناسبك.','ماشي، نبدأ بجلسة تعريفية.'][Math.floor(Math.random()*3)]]);if(cur=='chat')cl()},1200)}
function note(){$('#nt').insertAdjacentHTML('beforeend','<div contenteditable class="card" style="background:#fde68a;color:#333;min-width:130px;padding:8px">ملاحظة…</div>')}
function render(){const r=(location.hash||'#home').slice(1);cur=P[r]?r:'home';$('#app').innerHTML=P[cur]();
 $('#nav').innerHTML=[['home','الرئيسية'],['discover','اكتشف المهارات'],['dashboard','لوحتي'],['chat','المحادثات'],['board','السبورة'],['credits','الرصيد'],['challenges','التحديات']].map(a=>`<a href="#${a[0]}" class="${a[0]==cur?'on':''}">${a[1]}</a>`).join('');
 if(cur=='discover')list();if(cur=='chat')cl();if(cur=='board')initBoard();scrollTo(0,0)}
function initBoard(){const cv=$('#cv');bd=cv.getContext('2d');bd.lineCap='round';let d=0;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*420/r.height]};
 cv.onpointerdown=e=>{d=1;const[x,y]=p(e);bd.beginPath();bd.moveTo(x,y)};cv.onpointermove=e=>{if(!d)return;const[x,y]=p(e);bd.strokeStyle=er?'#fff':pc;bd.lineWidth=er?24:3;bd.lineTo(x,y);bd.stroke()};cv.onpointerup=cv.onpointerleave=()=>d=0}
addEventListener('hashchange',render);render();
</script></body></html>
